

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: legendhub-php
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:1.27
    container_name: legendhub-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: legendhub-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: legendhub
      MYSQL_USER: legendhub_user
      MYSQL_PASSWORD: legendhub_pass
    ports:
      - "3307:3306"
    volumes:
      - legendhub-db-data:/var/lib/mysql

volumes:
  legendhub-db-data:
